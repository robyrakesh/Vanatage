# Stacks detected: cicd:github-actions:.github/workflows,deps:node:.
version: 2.1
orbs:
  node: circleci/node@5
jobs:
  run-playwright-test:
    executor: playwright-executor
    parameters:
      env:
        type: string
        default: staging
    steps:
      - checkout
      - run: npm i -D @playwright/test
      - run: npx playwright install
      - run:
          name: Install npm dependencies
          command: npm ci
      - run:
          name: Install OpenJDK 11
          command: sudo apt-get install -y openjdk-11-jdk
      - run:
          name: Check Java version
          command: java -version
      - run:
          name: Install Allure CLI
          command: npm install -g allure-commandline
      - run:
          name: Run Playwright tests 
          command: npm run test
      - run:
          name: Generate Allure Report
          command: npm run allure-report
      - run:
          name: Deploy Allure Report to GitHub Pages
          command: npm run deploy
workflows:
  build-and-test:
    when:
      not:
        or:
          - equal: [<< pipeline.git.branch >>, << pipeline.parameters.main-branch >>]
          - matches:
              pattern: << pipeline.parameters.release-branch-pattern >>
              value: << pipeline.git.branch >>
    jobs:
      - run-playwright-test
   